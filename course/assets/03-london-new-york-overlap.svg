<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc">
<title id="title">London and New York overlap in SAST</title><desc id="desc">Standard time: London 10 to 19, New York 15 to midnight, overlap 15 to 19. Daylight time: London 9 to 18, New York 14 to 23, overlap 14 to 18. Transition: London 10 to 19, New York 14 to 23, overlap 14 to 19.</desc>
<rect width="760" height="330" rx="14" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#172033"><text x="24" y="29" font-size="20" font-weight="bold">London–New York overlap (SAST)</text><text x="24" y="51" font-size="13">Reference sessions · 24:00 means midnight at the end of the day</text>
<g font-size="12" text-anchor="middle"><text x="230" y="74">08:00</text><path d="M230 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="290" y="74">10:00</text><path d="M290 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="350" y="74">12:00</text><path d="M350 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="410" y="74">14:00</text><path d="M410 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="470" y="74">16:00</text><path d="M470 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="530" y="74">18:00</text><path d="M530 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="590" y="74">20:00</text><path d="M590 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="650" y="74">22:00</text><path d="M650 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/><text x="710" y="74">24:00</text><path d="M710 82V285" stroke="#cbd5e1" stroke-dasharray="3 4"/></g>
<g><text x="24" y="103" font-size="14" font-weight="bold">Both standard</text><text x="24" y="123" font-size="12">Overlap 15:00–19:00</text><rect x="290" y="89" width="270" height="18" rx="4" fill="#2563eb"/><rect x="440" y="111" width="270" height="18" rx="4" fill="#0f766e"/><rect x="440" y="132" width="120" height="6" rx="3" fill="#b45309"/></g><g><text x="24" y="171" font-size="14" font-weight="bold">Both daylight</text><text x="24" y="191" font-size="12">Overlap 14:00–18:00</text><rect x="260" y="157" width="270" height="18" rx="4" fill="#2563eb"/><rect x="410" y="179" width="270" height="18" rx="4" fill="#0f766e"/><rect x="410" y="200" width="120" height="6" rx="3" fill="#b45309"/></g><g><text x="24" y="239" font-size="14" font-weight="bold">Transition week</text><text x="24" y="259" font-size="12">Overlap 14:00–19:00</text><rect x="290" y="225" width="270" height="18" rx="4" fill="#2563eb"/><rect x="410" y="247" width="270" height="18" rx="4" fill="#0f766e"/><rect x="410" y="268" width="150" height="6" rx="3" fill="#b45309"/></g>

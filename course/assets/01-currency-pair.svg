<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc"><title id="title">Currency pair anatomy</title><desc id="desc">EUR is the base currency, USD is the quote currency. EUR/USD 1.1000 means one euro equals 1.1000 US dollars.</desc><rect width="720" height="260" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="360" y="42" font-size="19" font-weight="bold" fill="#334155">READING A FOREX QUOTE</text><rect x="90" y="68" width="250" height="105" rx="12" fill="#e0f2fe" stroke="#0369a1"/><rect x="380" y="68" width="250" height="105" rx="12" fill="#ede9fe" stroke="#6d28d9"/><text x="215" y="114" font-size="38" font-weight="bold" fill="#075985">EUR</text><text x="215" y="145" font-size="18" fill="#075985">Base currency</text><text x="360" y="128" font-size="32" fill="#475569">/</text><text x="505" y="114" font-size="38" font-weight="bold" fill="#5b21b6">USD</text><text x="505" y="145" font-size="18" fill="#5b21b6">Quote currency</text><text x="360" y="211" font-size="24" font-weight="bold" fill="#0f172a">EUR/USD = 1.1000</text><text x="360" y="239" font-size="16" fill="#334155">1 euro = 1.1000 US dollars (illustrative)</text></g></svg>

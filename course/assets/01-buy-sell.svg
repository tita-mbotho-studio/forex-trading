<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 285" role="img" aria-labelledby="title desc"><title id="title">Buy and sell direction</title><desc id="desc">A long position benefits from price increases and a short position benefits from price decreases, before costs. Hypothetical paths.</desc><rect width="720" height="285" rx="16" fill="#f8fafc"/><g font-family="Arial,sans-serif"><rect x="20" y="16" width="330" height="224" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="370" y="16" width="330" height="224" rx="12" fill="#fff" stroke="#cbd5e1"/><g text-anchor="middle" font-size="19" font-weight="bold"><text x="185" y="48" fill="#166534">BUY / LONG</text><text x="535" y="48" fill="#991b1b">SELL / SHORT</text></g><g stroke="#cbd5e1" stroke-dasharray="4 4"><path d="M45 150H325 M395 95H675"/></g><g fill="none" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><path d="M60 150 L104 131 L135 141 L179 103 L220 115 L265 78 L306 65" stroke="#15803d"/><path d="M410 95 L452 115 L485 104 L526 147 L562 135 L605 174 L656 189" stroke="#b91c1c"/></g><g font-size="15" fill="#334155"><text x="52" y="174">1.1000</text><text x="245" y="61">1.1050</text><text x="403" y="83">1.1000</text><text x="596" y="211">1.0950</text></g><g font-size="15" font-weight="bold" text-anchor="middle"><text x="185" y="222" fill="#166534">Rise is favourable</text><text x="535" y="222" fill="#991b1b">Fall is favourable</text></g><text x="360" y="266" text-anchor="middle" font-size="15" fill="#475569">Hypothetical prices · before costs · not a forecast</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Breakout, retest and false breakout</title><desc id="desc">Left: resistance breaks, price retests and rises. Right: price breaks resistance but closes back into the prior range.</desc><rect width="760" height="290" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="24" y="31" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">Breakout, retest and false breakout</text><g transform="translate(18 0)"><rect x="0" y="50" width="350" height="195" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="175" y="70" font-size="14" fill="#172033" text-anchor="middle" font-weight="bold">Breakout and retest</text><rect x="10" y="137" width="330" height="14" fill="#dbeafe" stroke="none" rx="0"/><text x="338" y="133" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal">Resistance</text><line x1="40" y1="168" x2="40" y2="207" stroke="#166534" stroke-width="2" /><rect x="30" y="177" width="20" height="19" fill="#166534" stroke="none" rx="0"/><line x1="80" y1="145" x2="80" y2="190" stroke="#166534" stroke-width="2" /><rect x="70" y="156" width="20" height="21" fill="#166534" stroke="none" rx="0"/><line x1="120" y1="139" x2="120" y2="180" stroke="#b91c1c" stroke-width="2" /><rect x="110" y="156" width="20" height="18" fill="#b91c1c" stroke="none" rx="0"/><line x1="160" y1="102" x2="160" y2="181" stroke="#166534" stroke-width="2" /><rect x="150" y="115" width="20" height="59" fill="#166534" stroke="none" rx="0"/><line x1="200" y1="110" x2="200" y2="149" stroke="#b91c1c" stroke-width="2" /><rect x="190" y="115" width="20" height="28" fill="#b91c1c" stroke="none" rx="0"/><line x1="240" y1="118" x2="240" y2="149" stroke="#166534" stroke-width="2" /><rect x="230" y="124" width="20" height="19" fill="#166534" stroke="none" rx="0"/><line x1="280" y1="78" x2="280" y2="133" stroke="#166534" stroke-width="2" /><rect x="270" y="89" width="20" height="35" fill="#166534" stroke="none" rx="0"/><text x="160" y="95" font-size="11" fill="#172033" text-anchor="middle" font-weight="bold">Break</text><text x="200" y="169" font-size="11" fill="#172033" text-anchor="middle" font-weight="bold">Retest</text><text x="280" y="77" font-size="11" fill="#172033" text-anchor="middle" font-weight="bold">Rise</text></g><g transform="translate(386 0)"><rect x="0" y="50" width="350" height="195" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="175" y="70" font-size="14" fill="#172033" text-anchor="middle" font-weight="bold">False breakout</text><rect x="10" y="137" width="330" height="14" fill="#dbeafe" stroke="none" rx="0"/><text x="338" y="133" font-size="11" fill="#2563eb" text-anchor="end" font-weight="normal">Resistance</text><line x1="40" y1="168" x2="40" y2="207" stroke="#166534" stroke-width="2" /><rect x="30" y="177" width="20" height="19" fill="#166534" stroke="none" rx="0"/><line x1="80" y1="145" x2="80" y2="190" stroke="#166534" stroke-width="2" /><rect x="70" y="156" width="20" height="21" fill="#166534" stroke="none" rx="0"/><line x1="120" y1="139" x2="120" y2="180" stroke="#b91c1c" stroke-width="2" /><rect x="110" y="156" width="20" height="18" fill="#b91c1c" stroke="none" rx="0"/><line x1="160" y1="101" x2="160" y2="181" stroke="#166534" stroke-width="2" /><rect x="150" y="116" width="20" height="58" fill="#166534" stroke="none" rx="0"/><line x1="200" y1="106" x2="200" y2="181" stroke="#b91c1c" stroke-width="2" /><rect x="190" y="116" width="20" height="56" fill="#b91c1c" stroke="none" rx="0"/><line x1="240" y1="151" x2="240" y2="196" stroke="#b91c1c" stroke-width="2" /><rect x="230" y="172" width="20" height="17" fill="#b91c1c" stroke="none" rx="0"/><line x1="280" y1="165" x2="280" y2="208" stroke="#b91c1c" stroke-width="2" /><rect x="270" y="189" width="20" height="12" fill="#b91c1c" stroke="none" rx="0"/><text x="160" y="94" font-size="11" fill="#172033" text-anchor="middle" font-weight="bold">Break</text><text x="200" y="197" font-size="11" fill="#172033" text-anchor="middle" font-weight="bold">Back inside</text></g><text x="380" y="268" font-size="13" fill="#475569" text-anchor="middle" font-weight="normal">Blue bands are resistance zones; observe completed candle closes.</text></g></svg>

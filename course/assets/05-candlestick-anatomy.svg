<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Candlestick anatomy (OHLC)</title><desc id="desc">Bullish close above open and bearish close below open; high and low mark wick extremes.</desc><rect width="760" height="290" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="24" y="31" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">Candlestick anatomy (OHLC)</text><text x="185" y="60" font-size="16" fill="#166534" text-anchor="middle" font-weight="bold">Bullish</text><line x1="185" y1="85" x2="185" y2="215" stroke="#166534" stroke-width="2" /><rect x="159" y="105" width="52" height="55" fill="#166534" stroke="none" rx="0"/><line x1="213" y1="85" x2="247" y2="85" stroke="#475569" stroke-width="1" /><text x="253" y="89" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">High</text><line x1="213" y1="160" x2="247" y2="160" stroke="#475569" stroke-width="1" /><text x="253" y="164" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">Open</text><line x1="213" y1="105" x2="247" y2="105" stroke="#475569" stroke-width="1" /><text x="253" y="109" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">Close</text><line x1="213" y1="215" x2="247" y2="215" stroke="#475569" stroke-width="1" /><text x="253" y="219" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">Low</text><text x="145" y="135" font-size="13" fill="#172033" text-anchor="end" font-weight="normal">Body</text><line x1="149" y1="130" x2="158" y2="130" stroke="#475569" stroke-width="1.5" /><text x="145" y="94" font-size="13" fill="#172033" text-anchor="end" font-weight="normal">Wick</text><line x1="149" y1="90" x2="181" y2="90" stroke="#475569" stroke-width="1.5" /><text x="525" y="60" font-size="16" fill="#b91c1c" text-anchor="middle" font-weight="bold">Bearish</text><line x1="525" y1="85" x2="525" y2="215" stroke="#b91c1c" stroke-width="2" /><rect x="499" y="105" width="52" height="55" fill="#b91c1c" stroke="none" rx="0"/><line x1="553" y1="85" x2="587" y2="85" stroke="#475569" stroke-width="1" /><text x="593" y="89" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">High</text><line x1="553" y1="105" x2="587" y2="105" stroke="#475569" stroke-width="1" /><text x="593" y="109" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">Open</text><line x1="553" y1="160" x2="587" y2="160" stroke="#475569" stroke-width="1" /><text x="593" y="164" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">Close</text><line x1="553" y1="215" x2="587" y2="215" stroke="#475569" stroke-width="1" /><text x="593" y="219" font-size="13" fill="#172033" text-anchor="start" font-weight="normal">Low</text><text x="485" y="135" font-size="13" fill="#172033" text-anchor="end" font-weight="normal">Body</text><line x1="489" y1="130" x2="498" y2="130" stroke="#475569" stroke-width="1.5" /><text x="485" y="94" font-size="13" fill="#172033" text-anchor="end" font-weight="normal">Wick</text><line x1="489" y1="90" x2="521" y2="90" stroke="#475569" stroke-width="1.5" /><text x="380" y="267" font-size="13" fill="#475569" text-anchor="middle" font-weight="normal">A candle does not show the order of intraperiod extremes.</text></g></svg>

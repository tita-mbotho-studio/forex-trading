<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Market structure</title><desc id="desc">Higher highs and higher lows, lower highs and lower lows, and a horizontal range.</desc><rect width="760" height="290" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="24" y="31" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">Market structure</text><g transform="translate(18 0)"><rect x="0" y="50" width="232" height="194" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="116" y="69" font-size="14" fill="#172033" text-anchor="middle" font-weight="bold">Uptrend</text><line x1="90" y1="188" x2="215" y2="125.5" stroke="#166534" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="20,214 58,162 90,188 130,122 162,152 208,85" fill="none" stroke="#166534" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="151" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">H</text><text x="90" y="204" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">HL</text><text x="130" y="111" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">HH</text><text x="162" y="169" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">HL</text><text x="208" y="82" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">HH</text></g><g transform="translate(264 0)"><rect x="0" y="50" width="232" height="194" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="116" y="69" font-size="14" fill="#172033" text-anchor="middle" font-weight="bold">Downtrend</text><line x1="90" y1="111" x2="215" y2="173.5" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5 4"/><polyline points="20,85 58,137 90,111 130,177 162,147 208,214" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="58" y="155" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">L</text><text x="90" y="100" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">LH</text><text x="130" y="195" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">LL</text><text x="162" y="136" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">LH</text><text x="208" y="232" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">LL</text></g><g transform="translate(510 0)"><rect x="0" y="50" width="232" height="194" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="116" y="69" font-size="14" fill="#172033" text-anchor="middle" font-weight="bold">Range</text><rect x="12" y="101" width="208" height="15" fill="#dbeafe" stroke="none" rx="0"/><rect x="12" y="186" width="208" height="15" fill="#dbeafe" stroke="none" rx="0"/><polyline points="20,193 60,109 97,190 135,111 171,194 208,112" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></g><text x="380" y="268" font-size="13" fill="#475569" text-anchor="middle" font-weight="normal">Dashed lines connect swing lows or highs; shaded bands mark range boundaries.</text></g></svg>

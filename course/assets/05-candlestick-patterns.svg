<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Five common candlestick patterns</title><desc id="desc">Doji, hammer, shooting star, bullish engulfing and bearish engulfing.</desc><rect width="760" height="290" rx="14" fill="#f8fafc"/><g font-family="Arial,sans-serif"><text x="24" y="31" font-size="20" fill="#172033" text-anchor="start" font-weight="bold">Five common candlestick patterns</text><rect x="15" y="58" width="138" height="180" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="84" y="80" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">Doji</text><line x1="84" y1="91" x2="84" y2="180" stroke="#475569" stroke-width="2" /><rect x="71" y="134" width="26" height="2" fill="#475569" stroke="none" rx="0"/><text x="84" y="217" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">Indecision</text><rect x="163" y="58" width="138" height="180" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="232" y="80" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">Hammer</text><line x1="232" y1="94" x2="232" y2="186" stroke="#166534" stroke-width="2" /><rect x="219" y="98" width="26" height="14" fill="#166534" stroke="none" rx="0"/><text x="232" y="217" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">After a decline</text><rect x="311" y="58" width="138" height="180" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="380" y="80" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">Shooting star</text><line x1="380" y1="83" x2="380" y2="177" stroke="#b91c1c" stroke-width="2" /><rect x="367" y="160" width="26" height="10" fill="#b91c1c" stroke="none" rx="0"/><text x="380" y="217" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">After a rise</text><rect x="459" y="58" width="138" height="180" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="528" y="80" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">Bullish engulfing</text><line x1="509" y1="107" x2="509" y2="163" stroke="#b91c1c" stroke-width="2" /><rect x="496" y="119" width="26" height="31" fill="#b91c1c" stroke="none" rx="0"/><line x1="547" y1="91" x2="547" y2="174" stroke="#166534" stroke-width="2" /><rect x="534" y="104" width="26" height="55" fill="#166534" stroke="none" rx="0"/><text x="528" y="217" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">After a decline</text><rect x="607" y="58" width="138" height="180" fill="#fff" stroke="#cbd5e1" rx="8"/><text x="676" y="80" font-size="12" fill="#172033" text-anchor="middle" font-weight="bold">Bearish engulfing</text><line x1="657" y1="107" x2="657" y2="164" stroke="#166534" stroke-width="2" /><rect x="644" y="120" width="26" height="33" fill="#166534" stroke="none" rx="0"/><line x1="695" y1="98" x2="695" y2="180" stroke="#b91c1c" stroke-width="2" /><rect x="682" y="111" width="26" height="58" fill="#b91c1c" stroke="none" rx="0"/><text x="676" y="217" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal">After a rise</text><text x="380" y="265" font-size="13" fill="#475569" text-anchor="middle" font-weight="normal">Context and later price behaviour matter.</text></g></svg>
